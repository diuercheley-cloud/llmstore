stages:
  - preflight
  - lint
  - test
  - security
  - build
  - validate
  - chaos
  - package
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

include:
  - local: .gitlab/ci/backend.yml
  - local: .gitlab/ci/frontend.yml
  - local: .gitlab/ci/e2e.yml
  - local: .gitlab/ci/security.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/docker.yml
  - local: .gitlab/ci/kubernetes.yml
  - local: .gitlab/ci/chaos.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/compliance.yml

preflight:check:
  stage: preflight
  image: alpine:latest
  script:
    - apk add --no-cache bash
    - bash scripts/check-alembic-integrity.sh
    - if [ -f scripts/check-working-tree-clean.sh ]; then bash scripts/check-working-tree-clean.sh; fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

platform:freeze-check:
  stage: preflight
  image: python:3.10
  variables:
    GIT_DEPTH: 0
  script:
    - git fetch origin tag v1.9.7-compliance-readiness || true
    - make platform-freeze-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
