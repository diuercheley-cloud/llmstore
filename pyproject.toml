# ==============================================================================
# Dependency Management Policy:
# 1. pyproject.toml (this file) defines abstract dependencies with loose/minimal 
#    version constraints (e.g., fastapi>=0.115.0) to ensure library compatibility.
# 2. requirements.txt / lockfiles (like uv.lock) pin exact resolved versions 
#    for reproducible, deterministic production and CI environments.
# 3. requirements.txt is compiled/generated from pyproject.toml to ensure consistency.
# ==============================================================================

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-harness"
version = "1.0.0"
description = "Modular LLM Harness — governed agentic execution and autonomous coding"
readme = "scripts/llm_harness/README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.7",
    # Control Plane Core Dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.15.0",
    "redis[hiredis]>=5.2.0",
    "prometheus-client>=0.21.0",
    "orjson>=3.10.0",
    "python-multipart>=0.0.18",
    "psutil>=5.9.0",
    "pgvector>=0.3.0",
    "kubernetes>=35.0.0",
    "kopf>=1.44.5",
    "sentence-transformers>=3.3.0",
    "pymupdf>=1.25.0",
    "pillow>=10.0.0",
    "langchain-text-splitters>=0.3.0",
    "PyJWT>=2.8.0",
    "cryptography>=44.0.0",
    "tiktoken>=0.9.0",
    "tokenizers>=0.21.0",
    "croniter>=6.0.0",
    "jsonschema>=4.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-semantic-conventions>=0.50b0",
]

[project.scripts]
llm-harness = "scripts.llm_harness.cli:main"
llmstack = "scripts.llm_harness.stack_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "grimp>=3.14",
    "ruff>=0.1",
    "mypy>=1.0",
    "pytest-cov",
    "hypothesis",
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts.llm_harness", "scripts.llm_harness.*", "control_plane", "control_plane.*"]

[tool.setuptools.package-data]
"scripts.llm_harness" = ["py.typed", "templates/*.jinja"]
"control_plane" = ["py.typed", "app/static/**/*", "alembic.ini", "alembic/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "ARG", "N"]
ignore = [
    "B008", # Do not perform function calls in argument defaults
    "E501", # Line too long (allow long mock outputs and assertions)
    "UP007", # Union to X | Y type annotations (keep compatibility)
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "B904", # raise exception from (keep simpler exceptions)
    "SIM117", # Nested with statements (allowed for compatibility)
    "SIM102", # Nested if statements (allowed for readability)
    "N817", # CamelCase imported as acronym
    "N814", # CamelCase imported as constant
    # Remaining lint errors to be resolved manually
    "E722", # do not use bare except
    "B023", # function closure uses loop variable
    "B030", # except handlers must catch BaseException-derived classes
    "F821", # undefined name
    "F811", # redefined-while-unused
    "F841", # local variable assigned but never used
    "SIM105", # use contextlib.suppress instead of try-except-pass
    "B007", # loop control variable not used within loop body
    "B011", # do not assert False
    "ARG005", # unused lambda argument
    "E741", # ambiguous variable name
    "SIM115", # use a context manager for opening files
    "B905", # zip() without an explicit strict parameter
    "SIM103", # needless boolean control flow
    "N806", # variable name in function should be lowercase
    "SIM108", # use ternary operator instead of if-else
    "ARG004", # unused static method argument
    "N818", # exception name should end with Error
    "W293", # blank line contains whitespace
    "SIM110", # reimplemented builtin any or all
    "N801", # class name should use CapWords convention
    "B017", # asserting on too broad/blind exceptions
    "ARG003", # unused class method argument
    "B006", # do not use mutable data structures for argument defaults
    "W291", # trailing whitespace
    "SIM118", # use key in dict instead of key in dict.keys()
    "SIM201", # negate-equal-op
    "SIM116", # if-else block instead of dictionary lookup
    "SIM212", # if-expr-with-twisted-arms
    "SIM211", # if-expr-with-false-true
    "E731", # do not assign a lambda expression, use a def
    "SIM210", # if-expr-with-true-false
    "SIM113", # use enumerate in for loop
    "SIM222", # expression or True
    "SIM109", # compare with tuple
    "E402", # module level import not at top of file
    "F401", # unused import
    "F403", # star imports used
    "UP035", # deprecated import
    "E712", # comparison to True/False should be cond or not cond
    "UP042", # replace-str-enum
    "E711", # comparison to None should be cond is None
    "UP045", # non-pep604-annotation-optional
]


[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = false
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
exclude = [
    "control_plane/alembic/archive",
    "examples",
]

[[tool.mypy.overrides]]
module = [
    "yaml",
    "hypothesis.*",
    "opentelemetry.*",
    "tiktoken.*",
    "tiktoken",
    "mlflow.*",
    "mlflow",
    "psutil.*",
    "app.api.dependencies.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = [
    "tests",
]

[tool.coverage.run]
branch = true
source = ["scripts/llm_harness", "control_plane"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/.venv/*",
]

[tool.coverage.report]
fail_under = 37
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]
