[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-harness"
version = "1.0.0"
description = "Modular LLM Harness — governed agentic execution and autonomous coding"
readme = "scripts/llm_harness/README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
llm-harness = "scripts.llm_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.0",
    "pytest-cov",
    "hypothesis",
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts.llm_harness", "scripts.llm_harness.*"]

[tool.setuptools.package-data]
"scripts.llm_harness" = ["py.typed", "templates/*.jinja"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "ARG", "N"]
ignore = [
    "B008", # Do not perform function calls in argument defaults
    "E501", # Line too long (allow long mock outputs and assertions)
    "UP007", # Union to X | Y type annotations (keep compatibility)
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "B904", # raise exception from (keep simpler exceptions)
    "SIM117", # Nested with statements (allowed for compatibility)
    "SIM102", # Nested if statements (allowed for readability)
    "N817", # CamelCase imported as acronym
    "N814", # CamelCase imported as constant
]


[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = false
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "hypothesis.*",
    "opentelemetry.*",
    "tiktoken.*",
    "tiktoken",
    "mlflow.*",
    "mlflow",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = [
    "tests",
]

[tool.coverage.run]
branch = true
source = ["scripts/llm_harness"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/.venv/*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]
