version: 2
updates:
  # Python (uv/pip) - Control Plane
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Node.js - Root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      node-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Node.js - Frontend Admin
  - package-ecosystem: "npm"
    directory: "/frontend/admin"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"

  # Node.js - Frontend Client
  - package-ecosystem: "npm"
    directory: "/frontend/client"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"

  # Node.js - SDK Node
  - package-ecosystem: "npm"
    directory: "/sdk/node"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "sdk"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
