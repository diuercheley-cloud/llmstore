name: Security

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
      - name: Setup Node
        uses: ./.github/actions/setup-node-admin
      - name: Security Checks
        uses: ./.github/actions/run-security-checks
      - name: Validar Artifacts
        run: |
          # Garantir que não existem arquivos sensíveis no root que possam ser buildados
          if [ -f .env ]; then echo ".env detectado!" && exit 1; fi
          if [ -d data/pki ]; then echo "data/pki detectado!" && exit 1; fi
          find . -name "*.key" | grep -v "node_modules" && (echo "Chaves privadas detectadas!" && exit 1) || true
