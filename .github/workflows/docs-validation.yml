name: Docs Validation

on:
  pull_request:
    paths: [ 'docs/**', 'README.md', 'CHANGELOG.md' ]

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then echo "CHANGELOG.md faltando!" && exit 1; fi
      - name: Check Internal Links
        run: |
          # Básico grep para links markdown internos quebrados
          grep -roE '\[.*\]\(file:///.*\)' docs/ | while read -r line; do
            path=$(echo "$line" | sed -E 's/.*\(file:\/\/\/(.*)\).*/\1/')
            if [ ! -f "$path" ] && [ ! -d "$path" ]; then
              echo "Link quebrado: $path"
              # exit 1 (desativado para evitar falsos positivos com paths absolutos de sistema)
            fi
          done
      - name: Validate Release Notes
        run: |
          if ls docs/releases/*.md 1> /dev/null 2>&1; then
            echo "Release notes encontradas."
          else
            echo "Aviso: Nenhuma release note encontrada em docs/releases/"
          fi
