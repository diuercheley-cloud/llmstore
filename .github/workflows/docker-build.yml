name: Docker Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Control Plane
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control_plane/Dockerfile
          push: false
          tags: llm-inference-stack/control-plane:latest
      - name: Build Admin UI
        uses: docker/build-push-action@v5
        with:
          context: frontend/admin
          push: false
          tags: llm-inference-stack/admin-ui:latest
