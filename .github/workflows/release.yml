name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  actions: read

jobs:
  validate-release:
    name: Validate Release Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate LICENSE File
        run: |
          if [ ! -f LICENSE ]; then
            echo "ERROR: LICENSE file is missing. Release blocked."
            exit 1
          fi
          echo "LICENSE file present. SPDX: $(head -3 LICENSE | grep -oP 'Apache License|MIT|GNU AGPL|GNU GPL|GNU LGPL|BSD' || echo 'unknown')"
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
      - name: Start Stack
        run: EXTRA_COMPOSE_FILES=.github/compose.release-validation.override.yml make up
      - name: Wait For Stack Readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if ./scripts/dev/test-health.sh >/tmp/release-health.log 2>&1; then
              cat /tmp/release-health.log
              exit 0
            fi
            echo "Stack not ready yet (attempt ${attempt}/30). Retrying in 10s..."
            sleep 10
          done
          echo "Stack did not become ready in time."
          cat /tmp/release-health.log
          exit 1
      - name: Full Quality Suite
        run: |
          make stabilization-check
          make test-smoke-resilience
          make test-chaos-resilience
          make operational-readiness
          make release-gate TAG=${{ github.ref_name }}
      - name: Verify Artifacts & SBOM
        run: |
          make verify-release-artifacts TAG=${{ github.ref_name }}
          bash scripts/release/generate-sbom.sh ${{ github.ref_name }}
      - name: Stop Stack
        if: always()
        run: EXTRA_COMPOSE_FILES=.github/compose.release-validation.override.yml make down

  publish-sdk:
    name: Publish Python SDK
    needs: validate-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
      - name: Build and Publish to PyPI (Dry-run)
        run: |
          pip install build twine
          cd sdk/python
          python -m build
          # twine upload dist/* --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}
          echo "[DRY-RUN] Simulating PyPI publish for v${{ github.ref_name }}"

  publish-docker:
    name: Publish Docker Images
    needs: validate-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker
        uses: ./.github/actions/setup-docker
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Control Plane
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/control-plane/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }},ghcr.io/${{ github.repository }}/control-plane:latest

      - name: Build and Push Quickstart
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.quickstart
          push: true
          tags: ghcr.io/llm-inference-stack/quickstart:${{ github.ref_name }},ghcr.io/llm-inference-stack/quickstart:latest

  publish-docs:
    name: Publish Versioned Docs
    needs: validate-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
        with:
          extra-deps: ruff pytest pytest-asyncio pytest-cov mkdocs mkdocs-material mike
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build Generated Docs
        run: |
          python scripts/docs/generate_reference_docs.py
          python scripts/docs/generate_docs_site.py
          mkdocs build --strict
      - name: Publish Versioned Docs
        run: |
          mike deploy --push --update-aliases "${{ github.ref_name }}" latest
          mike set-default --push latest

  create-github-release:
    name: Create GitHub Release
    needs: [publish-sdk, publish-docker, publish-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Frontend
        run: |
          npm ci
          npm run build
          zip -r admin-v2-build.zip control_plane/app/static/admin-v2
          zip -r client-build.zip frontend/client/dist
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            admin-v2-build.zip
            client-build.zip
          generate_release_notes: true
          draft: false
          prerelease: false
      
      - name: Upload Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/release/upload_release_artifacts.sh
          # Assume que o release-gate gerou artefatos em releases/${{ github.ref_name }}
          if [ -d "releases/${{ github.ref_name }}" ]; then
            ./scripts/release/upload_release_artifacts.sh ${{ github.ref_name }} releases/${{ github.ref_name }}
          else
            echo "Aviso: Diretorio releases/${{ github.ref_name }} nao encontrado. Pulando upload."
          fi
