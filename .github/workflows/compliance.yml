name: Continuous Compliance
on:
  pull_request:
    paths:
      - 'compliance/**'
      - 'scripts/compliance-*'
      - 'control_plane/app/services/compliance_*'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  compliance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compliance Readiness Lint
        run: make compliance-check
      - name: Evidence Dry-run
        run: make compliance-evidence
      - name: Upload Sanitized Evidence (Internal)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence-dryrun
          path: artifacts/compliance/latest/audit-package.zip
          retention-days: 7

  compliance-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compliance-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Compliance Release Gate
        run: make compliance-release-gate TAG=${{ github.ref_name }}
