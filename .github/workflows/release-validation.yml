name: Release Validation

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
      - name: Start Stack
        run: EXTRA_COMPOSE_FILES=.github/compose.release-validation.override.yml make up
      - name: Wait For Stack Readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if ./scripts/test-health.sh >/tmp/release-health.log 2>&1; then
              cat /tmp/release-health.log
              exit 0
            fi
            echo "Stack not ready yet (attempt ${attempt}/30). Retrying in 10s..."
            sleep 10
          done
          echo "Stack did not become ready in time."
          cat /tmp/release-health.log
          exit 1
      - name: Stabilization Check
        run: make stabilization-check
      - name: Smoke Resilience
        run: make test-smoke-resilience
      - name: Chaos Resilience
        run: make test-chaos-resilience
      - name: Operational Readiness
        run: make operational-readiness
      - name: Quick Validation
        run: make validate-quick
      - name: Run Release Gate
        run: make release-gate TAG=${{ github.ref_name }}
      - name: Verify Artifacts & Checksums
        run: make verify-release-artifacts TAG=${{ github.ref_name }}
      - name: Generate SBOM
        run: bash scripts/generate-sbom.sh ${{ github.ref_name }}
      - name: Sign Artifacts (Opt-in)
        run: bash scripts/sign-release-artifacts.sh ${{ github.ref_name }} ${{ secrets.RELEASE_SIGNING_KEY }}
      - name: Generate Validation Artifact
        uses: ./.github/actions/upload-release-artifacts
        with:
          version: ${{ github.ref_name }}
      - name: Dump Stack Diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f .github/compose.release-validation.override.yml ps || true
          docker compose --env-file .env.example -f docker-compose.yml -f .github/compose.release-validation.override.yml logs --tail=200 control-plane || true
      - name: Stop Stack
        if: always()
        run: EXTRA_COMPOSE_FILES=.github/compose.release-validation.override.yml make down
