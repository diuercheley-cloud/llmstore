name: CI

on:
  push:
    branches: [ main, 'release/*', 'feature/*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, 'release/*' ]
  workflow_dispatch:
    inputs:
      run_agent_benchmarks:
        description: 'Run agent benchmark suite'
        required: false
        default: 'false'

permissions:
  contents: read
  security-events: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - api
          - frontend-admin
          - frontend-client
          - docker-quickstart
          - sdk
          - e2e
          - security
          - docs

    services:
      postgres:
        # Only start postgres for 'api'
        image: ${{ matrix.target == 'api' && 'postgres:15-alpine' || 'alpine:latest' }}
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: llm_inference_test
        ports:
          - 5432:5432
        options: >-
          ${{ matrix.target == 'api' && '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5' || 'true' }}
      redis:
        # Start redis for 'api' and 'e2e'
        image: ${{ (matrix.target == 'api' || matrix.target == 'e2e') && 'redis:7-alpine' || 'alpine:latest' }}
        ports:
          - 6379:6379
        options: >-
          ${{ (matrix.target == 'api' || matrix.target == 'e2e') && '--health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5' || 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Setup Steps ---
      - name: Setup Python
        if: contains(fromJSON('["api", "sdk", "security", "docs"]'), matrix.target)
        uses: ./.github/actions/setup-python-project

      - name: Setup Node (Admin)
        if: matrix.target == 'frontend-admin'
        uses: ./.github/actions/setup-node-project
        with:
          project-dir: frontend/admin

      - name: Setup Node (Client)
        if: matrix.target == 'frontend-client'
        uses: ./.github/actions/setup-node-project
        with:
          project-dir: frontend/client

      - name: Setup Node (E2E)
        if: matrix.target == 'e2e'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Node (Security)
        if: matrix.target == 'security'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Docker
        if: matrix.target == 'docker-quickstart'
        uses: ./.github/actions/setup-docker

      # --- Target: API ---
      - name: API Lint & Integrity
        if: matrix.target == 'api'
        run: |
          ruff check control_plane/app --no-cache --select F821,F811,E722
          make platform-freeze-check
          make check-feature-flags-integrity
          make check-supported-surface
          make maintenance-budgets
          bash scripts/validators/check-secrets.sh --all

      - name: Surface Governance Validation
        if: matrix.target == 'api'
        run: |
          make generate-route-surface
          make validate-route-surface
          make validate-deprecated-surface

      - name: API Database Migrations
        if: matrix.target == 'api'
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/llm_inference_test
        run: |
          cd control_plane
          alembic upgrade head

      - name: API Backend Tests (Release Gate)
        if: matrix.target == 'api'
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/llm_inference_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .:control_plane
        run: |
          pytest tests/control_plane -m "release_gate" --cov=app --junitxml=artifacts/reports/api-release-gate.xml
          pytest tests/integration/contracts tests/integration/quality tests/integration/security -m "release_gate"

      - name: Backup Component Tests (fast, unit-level)
        if: matrix.target == 'api'
        env:
          PYTHONPATH: .:control_plane
          BACKUP_RESTORE_ENABLED: "true"
        run: |
          mkdir -p artifacts/reports
          make test-backup-components

      # --- Target: Frontend Admin ---
      - name: Frontend Admin Lint, Typecheck & Test
        if: matrix.target == 'frontend-admin'
        run: |
          cd frontend/admin
          npm run lint
          npm run build
          npm run test

      # --- Target: Frontend Client ---
      - name: Frontend Client Lint & Build
        if: matrix.target == 'frontend-client'
        run: |
          cd frontend/client
          npm run lint
          npm run build

      # --- Target: Docker Quickstart ---
      - name: Build Quickstart Image
        if: matrix.target == 'docker-quickstart'
        run: |
          docker build -f Dockerfile.quickstart -t llm-inference-stack/quickstart:ci .

      - name: Run Agent Benchmarks
        if: matrix.target == 'api' && github.event_name == 'workflow_dispatch' && inputs.run_agent_benchmarks == 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/llm_inference_test
          PYTHONPATH: .:control_plane
        run: |
          pytest tests/integration/agent_evals/test_eval_framework.py -q

      # --- Target: SDK ---
      - name: SDK Tests
        if: matrix.target == 'sdk'
        run: |
          cd sdk/python
          pip install -e ".[dev]"
          pytest --cov=kleberai

      - name: SDK Build
        if: matrix.target == 'sdk' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          pip install build twine
          cd sdk/python
          python -m build
          twine check dist/*

      # --- Target: E2E ---
      - name: E2E Playwright Tests
        if: matrix.target == 'e2e'
        env:
          REDIS_URL: redis://localhost:6379/15
        run: |
          cd tests/e2e/e2e-playwright
          npm ci
          npx playwright install --with-deps
          npm run test:e2e

      # --- Target: Security ---
      - name: Security Scans
        if: matrix.target == 'security'
        uses: ./.github/actions/run-security-checks

      - name: Dependency Scan (Trivy)
        if: matrix.target == 'security'
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      # --- Target: Docs ---
      - name: Docs Validation
        if: matrix.target == 'docs'
        run: |
          pip install mkdocs mkdocs-material mike
          make validate-docs
          make docs-build

      # --- Post Steps ---
      - name: Upload Artifacts (E2E / SDK)
        if: always() && contains(fromJSON('["e2e", "sdk"]'), matrix.target)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifacts
          path: |
            tests/e2e/e2e-playwright/playwright-report/
            sdk/python/dist/
          retention-days: 7

      - name: Upload Surface Governance Artifacts
        if: matrix.target == 'api' && always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-governance-reports
          path: |
            generated/route_surface_manifest.json
            docs/generated/deprecated_surface_inventory.md
            artifacts/reports/api-release-gate.xml
          retention-days: 30

      - name: Upload Docs Artifacts
        if: matrix.target == 'docs' && always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-reports
          path: |
            docs/generated/
          retention-days: 30
