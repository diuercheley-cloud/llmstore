name: CI

on:
  push:
    branches: [ main, 'release/*' ]
  pull_request:
    branches: [ main, 'release/*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
      - name: Run Lint
        run: ruff check control_plane/

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: llm_inference_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/llm_inference_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd control_plane
          pytest tests/ -m "not slow" --cov=app

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: ./.github/actions/setup-node-admin
      - name: Build Frontend
        run: |
          cd frontend/admin
          npm run build
          npm run build-storybook

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tests/e2e-playwright/package-lock.json
      - name: Install Playwright Dependencies
        run: |
          cd tests/e2e-playwright
          npm ci
          npx playwright install --with-deps
      - name: Run E2E Tests
        env:
          REDIS_URL: redis://localhost:6379/15
        run: |
          cd tests/e2e-playwright
          npm run test:e2e
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e-playwright/playwright-report/
          retention-days: 30

  integrity-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: ./.github/actions/setup-python-project
      - name: Platform Freeze Check
        run: make platform-freeze-check
      - name: Feature Flag Integrity Check
        run: make check-feature-flags-integrity
      - name: Supported Surface Check
        run: make check-supported-surface
      - name: Platform Freeze Governance Check
        run: make check-freeze-governance
      - name: Alembic Integrity
        run: bash scripts/check-alembic-integrity.sh
      - name: Secrets Check
        run: bash scripts/check-secrets.sh --all
      - name: Operational Readiness Dry-run
        run: |
          # Mocking env for readiness check
          export OPERATIONAL_READINESS_CI_MODE=true
          bash scripts/operational-readiness-pack.sh
