name: 'Setup Python Project'
description: 'Sets up Python, dependencies, and caching'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  requirements-file:
    description: 'Path to requirements.txt'
    required: false
    default: 'control_plane/requirements.txt'
  extra-deps:
    description: 'Extra packages to install'
    required: false
    default: 'ruff pytest pytest-asyncio pytest-cov'
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ inputs.requirements-file }}" ]; then
          pip install -r ${{ inputs.requirements-file }}
        fi
        if [ -n "${{ inputs.extra-deps }}" ]; then
          pip install ${{ inputs.extra-deps }}
        fi
        # Check for local sdk installation if we are in sdk tests
        if [ -f "sdk/python/pyproject.toml" ] && [[ "${{ github.job }}" == *"sdk"* ]]; then
          pip install -e "sdk/python/[dev]"
        fi
