# Default values for llm-inference-stack.

replicaCount: 1

image:
  repository: control-plane
  pullPolicy: IfNotPresent
  tag: ""

imageCredentials:
  create: false

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: llm-stack.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

config:
  demoMode: false
  databaseUrl: ""
  redisUrl: ""
  dataPlaneBaseUrl: ""

postgres:
  enabled: true
  image: postgres:16-alpine
  password: "password"
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

dataPlane:
  enabled: true
  image:
    repository: data-plane
    tag: latest
  modelFile: "/models/model.gguf"
  ctxSize: "4096"
  persistence:
    enabled: true
    size: 100Gi
  gpu:
    enabled: false
    count: 1
    layers: "0"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4
      memory: 8Gi
  nodeSelector: {}
  tolerations: []

agentWorker:
  enabled: false
  replicaCount: 1
  runtimeEnabled: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

controlPlaneWorker:
  enabled: true
  replicaCount: 1

ragWorker:
  enabled: true
  replicaCount: 1

observability:
  enabled: false
  prometheus:
    image: prom/prometheus:latest
  grafana:
    image: grafana/grafana:latest
    adminPassword: "admin"
