{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-inference-stack.fullname" . }}-grafana
  labels:
    {{- include "llm-inference-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "llm-inference-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- end }}
