{{- if and .Values.postgres.enabled .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-inference-stack.fullname" . }}-postgres
  labels:
    {{- include "llm-inference-stack.labels" . | nindent 4 }}
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
---
{{- if and .Values.dataPlane.enabled .Values.dataPlane.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-inference-stack.fullname" . }}-models
  labels:
    {{- include "llm-inference-stack.labels" . | nindent 4 }}
    app: data-plane
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.dataPlane.persistence.size }}
{{- end }}
