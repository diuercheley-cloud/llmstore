apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-inference-stack.fullname" . }}-control-plane
  labels:
    {{- include "llm-inference-stack.labels" . | nindent 4 }}
    app: control-plane
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "llm-inference-stack.selectorLabels" . | nindent 4 }}
    app: control-plane
---
{{- if .Values.dataPlane.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-inference-stack.fullname" . }}-data-plane
  labels:
    {{- include "llm-inference-stack.labels" . | nindent 4 }}
    app: data-plane
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    {{- include "llm-inference-stack.selectorLabels" . | nindent 4 }}
    app: data-plane
{{- end }}
---
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-inference-stack.fullname" . }}-postgres
  labels:
    {{- include "llm-inference-stack.labels" . | nindent 4 }}
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "llm-inference-stack.selectorLabels" . | nindent 4 }}
    app: postgres
{{- end }}
---
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-inference-stack.fullname" . }}-redis
  labels:
    {{- include "llm-inference-stack.labels" . | nindent 4 }}
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "llm-inference-stack.selectorLabels" . | nindent 4 }}
    app: redis
{{- end }}
