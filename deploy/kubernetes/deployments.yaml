apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: llm-stack-config
        - secretRef:
            name: llm-stack-secrets
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-plane
  template:
    metadata:
      labels:
        app: data-plane
    spec:
      containers:
      - name: llama-cpp
        image: data-plane:latest # Placeholder
        ports:
        - containerPort: 8081
        env:
        - name: MODEL_FILE
          value: "/models/model.gguf"
        - name: LLAMA_SERVER_PORT
          value: "8081"
        volumeMounts:
        - name: models
          mountPath: /models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
      - name: control-plane
        image: control-plane:latest # Placeholder
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: llm-stack-config
        - secretRef:
            name: llm-stack-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane-worker
  template:
    metadata:
      labels:
        app: control-plane-worker
    spec:
      containers:
      - name: worker
        image: control-plane:latest # Same image
        command: ["bash", "-lc", "cd control_plane && alembic upgrade head && cd .. && python -m app.workers.generation_worker"]
        envFrom:
        - configMapRef:
            name: llm-stack-config
        - secretRef:
            name: llm-stack-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-worker
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      containers:
      - name: worker
        image: control-plane:latest
        command: ["bash", "-lc", "python -m app.workers.rag_worker"]
        envFrom:
        - configMapRef:
            name: llm-stack-config
        - secretRef:
            name: llm-stack-secrets
