apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-stack-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: llm-stack.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: control-plane
            port:
              number: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-stack-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-stack-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-stack-rb
subjects:
- kind: ServiceAccount
  name: llm-stack-sa
roleRef:
  kind: Role
  name: llm-stack-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-stack-netpol
spec:
  podSelector:
    matchLabels:
      app: control-plane
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: data-plane
    ports:
    - protocol: TCP
      port: 8081
