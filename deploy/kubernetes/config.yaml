apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-stack-config
data:
  POSTGRES_DB: "llmstack"
  POSTGRES_USER: "llmuser"
  REDIS_PORT: "6379"
  DEMO_MODE: "false"
  DATA_PLANE_BASE_URL: "http://data-plane:8081"
  DATABASE_URL: "postgresql://llmuser:password@postgres:5432/llmstack"
  REDIS_URL: "redis://redis:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-stack-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "password" # Template, should be replaced
