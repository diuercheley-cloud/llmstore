apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: data-plane
spec:
  ports:
  - port: 8081
  selector:
    app: data-plane
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  ports:
  - port: 8080
  selector:
    app: control-plane
  type: ClusterIP
