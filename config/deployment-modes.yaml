appliance:
  description: Fully local, self-contained deployment. No agentic runtime, workers,
    or external connectors enabled.
  features:
    AGENT_ASYNC_EXECUTION_ENABLED: false
    AGENT_CONNECTOR_EXTERNAL_NETWORK_ENABLED: false
    AGENT_CONNECTOR_WRITE_ENABLED: false
    AGENT_EMBEDDED_WORKER_ENABLED: false
    AGENT_ENTERPRISE_OBSERVABILITY_ENABLED: false
    AGENT_EXECUTION_ENABLED: false
    AGENT_MULTI_AGENT_ENABLED: false
    AGENT_RUNTIME_ENABLED: false
    AGENT_SAAS_CONNECTORS_ENABLED: false
    AGENT_SLO_ENFORCEMENT_ENABLED: false
    AGENT_STATEFUL_WORKFLOWS_ENABLED: false
    AGENT_STRICT_BUDGETS: false
    AGENT_STUDIO_ENABLED: false
    AGENT_TENANT_ISOLATION_STRICT: false
    AGENT_WORKER_AUTOSCALING_ENABLED: false
    AGENT_WORKER_ENABLED: false
  governance:
    posture: Strict Air-gapped / Local Only
    readiness_constraints:
    - expected: false
      flag: AGENT_RUNTIME_ENABLED
      severity: blocker
    - expected: false
      flag: AGENT_SAAS_CONNECTORS_ENABLED
      severity: blocker
    - expected: false
      flag: AGENT_MULTI_AGENT_ENABLED
      severity: blocker
    - expected: false
      flag: AGENT_STATEFUL_WORKFLOWS_ENABLED
      severity: blocker
  name: Appliance Mode
enterprise_managed:
  description: Federated enterprise grade deployment with strict isolation and managed
    control plane.
  features:
    AGENT_ASYNC_EXECUTION_ENABLED: true
    AGENT_CANARY_AGENTS_ENABLED: true
    AGENT_COGNITIVE_LOOPBACK_ENABLED: true
    AGENT_CONNECTOR_EXTERNAL_NETWORK_ENABLED: true
    AGENT_CONNECTOR_WRITE_ENABLED: true
    AGENT_ENTERPRISE_OBSERVABILITY_ENABLED: true
    AGENT_EVAL_REGRESSION_GATE_ENABLED: true
    AGENT_EXECUTION_ENABLED: true
    AGENT_FEDERATED_MEMORY_ENABLED: true
    AGENT_LLM_PROVIDER: gateway
    AGENT_MARKETPLACE_ENABLED: true
    AGENT_PROMOTION_REQUIRES_EVALS: true
    AGENT_RUNTIME_ENABLED: true
    AGENT_SAAS_CONNECTORS_ENABLED: true
    AGENT_SAB_ENABLED: true
    AGENT_SLO_ENFORCEMENT_ENABLED: true
    AGENT_STATEFUL_WORKFLOWS_ENABLED: true
    AGENT_STUDIO_ENABLED: true
    AGENT_TENANT_ISOLATION_STRICT: true
    AGENT_UNCERTAINTY_DETECTION_ENABLED: true
    AGENT_WALLETS_ENABLED: true
    AGENT_WORKER_AUTOSCALING_ENABLED: true
    AGENT_WORKER_ENABLED: true
    COMMERCIAL_FEDERATION_ENABLED: true
    COMMERCIAL_GOVERNANCE_FEDERATION_ENABLED: true
    MANAGED_CONTROL_PLANE_ENABLED: true
  governance:
    posture: Enterprise Managed / Federated & Strict Isolation
    readiness_constraints:
    - expected: true
      flag: AGENT_RUNTIME_ENABLED
      severity: blocker
    - expected: true
      flag: AGENT_TENANT_ISOLATION_STRICT
      severity: blocker
    - expected: true
      flag: MANAGED_CONTROL_PLANE_ENABLED
      severity: blocker
    - expected: gateway
      flag: AGENT_LLM_PROVIDER
      severity: blocker
    - expected: false
      flag: AGENT_ALLOW_MOCK_LLM_IN_PRODUCTION
      severity: blocker
    - expected: true
      flag: AGENT_REQUIRE_REAL_LLM_FOR_PRODUCTION
      severity: blocker
  name: Enterprise Managed Mode
pilot:
  description: Controlled evaluation mode. Agentic runtime enabled with read-only
    connectors and strict approvals.
  features:
    AGENT_APPROVAL_REQUIRED_FOR_HIGH_RISK: true
    AGENT_ASYNC_EXECUTION_ENABLED: true
    AGENT_CANARY_AGENTS_ENABLED: true
    AGENT_COGNITIVE_LOOPBACK_ENABLED: true
    AGENT_CONNECTOR_EXTERNAL_NETWORK_ENABLED: true
    AGENT_CONNECTOR_WRITE_ENABLED: false
    AGENT_EMBEDDED_WORKER_ENABLED: true
    AGENT_ENTERPRISE_OBSERVABILITY_ENABLED: false
    AGENT_EXECUTION_ENABLED: true
    AGENT_FEDERATED_MEMORY_ENABLED: true
    AGENT_HUMAN_APPROVAL_ENABLED: true
    AGENT_MARKETPLACE_ENABLED: true
    AGENT_MULTI_AGENT_ENABLED: false
    AGENT_RUNTIME_ENABLED: true
    AGENT_SAAS_CONNECTORS_ENABLED: true
    AGENT_SAB_ENABLED: true
    AGENT_SLO_ENFORCEMENT_ENABLED: false
    AGENT_STATEFUL_WORKFLOWS_ENABLED: true
    AGENT_STRICT_BUDGETS: true
    AGENT_STUDIO_ENABLED: true
    AGENT_TENANT_ISOLATION_STRICT: false
    AGENT_UNCERTAINTY_DETECTION_ENABLED: true
    AGENT_WALLETS_ENABLED: true
    AGENT_WORKER_AUTOSCALING_ENABLED: false
    AGENT_WORKER_ENABLED: true
  governance:
    posture: Governed Testing / Human-in-the-loop
    readiness_constraints:
    - expected: true
      flag: AGENT_RUNTIME_ENABLED
      severity: blocker
    - expected: false
      flag: AGENT_CONNECTOR_WRITE_ENABLED
      severity: blocker
    - expected: true
      flag: AGENT_HUMAN_APPROVAL_ENABLED
      severity: blocker
    - expected: false
      flag: AGENT_MULTI_AGENT_ENABLED
      severity: warning
  name: Pilot Mode
production:
  description: Full production deployment with governed connectors, mandatory eval
    gates, and SLO enforcement.
  features:
    AGENT_ASYNC_EXECUTION_ENABLED: true
    AGENT_CANARY_AGENTS_ENABLED: true
    AGENT_COGNITIVE_LOOPBACK_ENABLED: true
    AGENT_CONNECTOR_EXTERNAL_NETWORK_ENABLED: true
    AGENT_CONNECTOR_WRITE_ENABLED: true
    AGENT_EVAL_REGRESSION_GATE_ENABLED: true
    AGENT_EXECUTION_ENABLED: true
    AGENT_FEDERATED_MEMORY_ENABLED: true
    AGENT_LLM_PROVIDER: gateway
    AGENT_MARKETPLACE_ENABLED: true
    AGENT_PROMOTION_REQUIRES_EVALS: true
    AGENT_RUNTIME_ENABLED: true
    AGENT_SAAS_CONNECTORS_ENABLED: true
    AGENT_SAB_ENABLED: true
    AGENT_SLO_ENFORCEMENT_ENABLED: true
    AGENT_STATEFUL_WORKFLOWS_ENABLED: true
    AGENT_STUDIO_ENABLED: true
    AGENT_UNCERTAINTY_DETECTION_ENABLED: true
    AGENT_WALLETS_ENABLED: true
    AGENT_WORKER_AUTOSCALING_ENABLED: true
    AGENT_WORKER_ENABLED: true
  governance:
    posture: Production Grade / Automatic Evals & SLOs
    readiness_constraints:
    - expected: true
      flag: AGENT_RUNTIME_ENABLED
      severity: blocker
    - expected: true
      flag: AGENT_PROMOTION_REQUIRES_EVALS
      severity: blocker
    - expected: true
      flag: AGENT_EVAL_REGRESSION_GATE_ENABLED
      severity: blocker
    - expected: gateway
      flag: AGENT_LLM_PROVIDER
      severity: blocker
    - expected: false
      flag: AGENT_ALLOW_MOCK_LLM_IN_PRODUCTION
      severity: blocker
    - expected: true
      flag: AGENT_REQUIRE_REAL_LLM_FOR_PRODUCTION
      severity: warning
  name: Production Mode
