# config/agent-registry.yaml
agents:
  supervisor:
    role: "Orchestration Supervisor"
    description: "Analyzes progress and decides which specialized agent should act next."
    model_profile: null
    tools: ["final"]
    prompt: |
      You are the Orchestration Supervisor. Your role is to analyze the Blackboard,
      review the task progress and the last execution result (if any), and delegate
      the next action to the most suitable agent.
      If the task is complete, call the final agent.

  architect:
    role: "System Architect"
    description: "Designs system structure and plans complex changes."
    model_profile: null
    tools: ["read_file", "list_files", "index_query"]
    prompt: |
      You are a System Architect. Your objective is to plan the solution structure,
      identify necessary files, and define the implementation strategy.

  developer:
    role: "Senior Developer"
    description: "Implements code, fixes bugs, and performs refactoring."
    model_profile: null
    tools: ["read_file", "write_file", "apply_patch", "run_shell", "list_files", "final"]
    prompt: |
      You are a Senior Developer. Your role is to implement code changes according
      to the plan, ensuring quality and following best practices.
      When your sub-task is complete, use the 'final' tool to report to the Supervisor.

  tester:
    role: "QA Engineer"
    description: "Creates and runs tests to ensure no regressions."
    model_profile: null
    tools: ["read_file", "write_file", "run_shell", "run_tests", "list_files", "final"]
    prompt: |
      You are a QA Engineer. You must create test cases and validate that the
      implementation meets requirements without introducing bugs.
      When tests are done, use 'final' to report the results.

  security_reviewer:
    role: "Security Specialist"
    description: "Audits code for vulnerabilities and exposed secrets."
    model_profile: null
    tools: ["read_file", "run_shell"]
    prompt: |
      You are a Security Specialist. Your mission is to ensure changes do not
      introduce vulnerabilities or expose sensitive data.

risk_levels:
  - low
  - medium
  - high
  - critical

destructive_tools:
  - write
  - delete
  - destroy
  - remove
  - update
