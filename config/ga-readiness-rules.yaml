rules:
  criteria:
    - operational_readiness_passed
    - agentic_readiness_passed
    - release_gate_passed
    - platform_freeze_passed
    - surface_audit_clean
    - no_orphaned_flags
    - security_warnings_classified
    - eval_gate_enforced
    - provider_validation_recent
    - no_silent_mock_in_production
    - no_silent_task_simulation
    - tenant_isolation_validated
  ga_requires_all_criteria: true
  provider_validation_max_age_days: 30
  allowed_release_statuses:
    - experimental
    - beta
    - pilot_ready
    - production_ready
    - ga_ready

weights:
  experimental: 0
  beta: 4
  pilot_ready: 8
  production_ready: 11
  ga_ready: 12
