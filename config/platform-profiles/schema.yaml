valid_flags:
  AGENT_RUNTIME_ENABLED:
    type: boolean
    description: Enables agent runtime execution core
    override_allowed: true
    high_risk: false
  AGENT_WORKER_ENABLED:
    type: boolean
    description: Enables background worker to process agent tasks
    override_allowed: true
    high_risk: false
  AGENT_EVALS_ENABLED:
    type: boolean
    description: Enables evaluation of runs
    override_allowed: true
    high_risk: false
  AGENT_CODE_INTERPRETER_ENABLED:
    type: boolean
    description: Enables code interpreter tool execution
    override_allowed: true
    high_risk: false
  AGENT_CODE_SANDBOX_PROVIDER:
    type: string
    description: Provider used for tool sandbox (docker, gvisor, firecracker, mock)
    override_allowed: true
    high_risk: true
  AGENT_SANDBOX_ALLOW_SIMULATED_PROVIDER:
    type: boolean
    description: Allows simulated fallback sandbox
    override_allowed: true
    high_risk: true
  AGENT_SANDBOX_PRODUCTION_REQUIRES_ATTESTATION:
    type: boolean
    description: Enforces hardware attestation for sandboxes
    override_allowed: true
    high_risk: true
  AGENT_READINESS_CHECKS_ENABLED:
    type: boolean
    description: Enforces platform readiness checks on startup
    override_allowed: true
    high_risk: false
  AGENT_ENTERPRISE_OBSERVABILITY_ENABLED:
    type: boolean
    description: Enforces real enterprise observability
    override_allowed: true
    high_risk: false
  AGENT_PLUGIN_SUPPLY_CHAIN_ENABLED:
    type: boolean
    description: Enforces plugin supply chain verification
    override_allowed: true
    high_risk: false
  PLUGIN_SIGNATURE_REQUIRED:
    type: boolean
    description: Enforces cryptographic signature verification on plugins
    override_allowed: true
    high_risk: false
  CRYPTO_RECEIPTS_ENABLED:
    type: boolean
    description: Enforces cryptographic receipts signing
    override_allowed: true
    high_risk: false
  AGENT_MCP_ENABLED:
    type: boolean
    description: Master toggle for MCP tool integration
    override_allowed: true
    high_risk: false
  AGENT_PROMOTION_REQUIRES_EVALS:
    type: boolean
    description: Enforces agent definition promotion to require evaluation passes
    override_allowed: true
    high_risk: false
  AGENT_LLM_PROVIDER:
    type: string
    description: Configured agent execution LLM provider (mock, gateway, real)
    override_allowed: true
    high_risk: false
  ABUSE_DETECTION_ENABLED:
    type: boolean
    description: Enable abuse detection checks
    override_allowed: true
    high_risk: false
  DISTRIBUTED_RUNTIME_ENABLED:
    type: boolean
    description: Enables distributed runtime configuration
    override_allowed: true
    high_risk: false
  MULTI_CLUSTER_ENABLED:
    type: boolean
    description: Enable multi-cluster orchestrator controls
    override_allowed: true
    high_risk: false
  MANAGED_CONTROL_PLANE_ENABLED:
    type: boolean
    description: Enable managed control plane components
    override_allowed: true
    high_risk: false
  AGENT_DYNAMIC_TOOL_EXECUTION_ENABLED:
    type: boolean
    description: Enables agents to dynamically invoke tools
    override_allowed: true
    high_risk: false
  AGENT_CONNECTOR_CATALOG_ENABLED:
    type: boolean
    description: Enables agent connector registration
    override_allowed: true
    high_risk: false
  AGENT_DISTRIBUTED_RUNTIME_ENABLED:
    type: boolean
    description: Enables agentic workflow runs distributed processing
    override_allowed: true
    high_risk: false
  AGENT_CLUSTER_FEDERATION_ENABLED:
    type: boolean
    description: Enables cluster federation features for agents
    override_allowed: true
    high_risk: false
  AGENT_EXECUTION_PLANE_ENABLED:
    type: boolean
    description: Enforces agent execution plane activity
    override_allowed: true
    high_risk: false



dependencies:
  - flag: AGENT_SANDBOX_PRODUCTION_REQUIRES_ATTESTATION
    requires:
      AGENT_CODE_SANDBOX_PROVIDER: ["gvisor", "firecracker"]

conflicts:
  - flag1: AGENT_SANDBOX_ALLOW_SIMULATED_PROVIDER
    flag2: AGENT_SANDBOX_PRODUCTION_REQUIRES_ATTESTATION
    value1: true
    value2: true
    message: Cannot allow simulated provider when attestation is required.
