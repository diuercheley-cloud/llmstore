<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pricing | LLM Inference Stack</title>
    <style>
      :root {
        --bg: #fbf5ec;
        --panel: #fffdf9;
        --ink: #1f1a16;
        --muted: #70655d;
        --line: rgba(31, 26, 22, 0.12);
        --accent: #16605a;
        --accent-soft: #d9efe8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, rgba(22, 96, 90, 0.18), transparent 25%),
          linear-gradient(180deg, #fff9f0 0%, var(--bg) 100%);
        line-height: 1.5;
      }
      .shell { width: min(1140px, calc(100% - 32px)); margin: 0 auto; padding-bottom: 56px; }
      .nav { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; }
      .nav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; }
      .nav .brand { font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; }
      
      h1 {
        margin: 54px 0 14px;
        font-size: clamp(32px, 5vw, 56px);
        line-height: 1.1;
        letter-spacing: -0.04em;
        font-weight: 800;
      }
      .lead { max-width: 62ch; font-size: 18px; line-height: 1.6; color: var(--muted); margin-bottom: 40px; }
      
      .pricing {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 34px;
      }
      .plan {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(34, 20, 9, 0.05);
        display: flex;
        flex-direction: column;
        transition: transform 0.2s;
      }
      .plan:hover { transform: translateY(-4px); }
      .plan.highlight {
        border-color: var(--accent);
        border-width: 2px;
        background: linear-gradient(180deg, #ffffff 0%, #f3fbf8 100%);
      }
      .badge {
        display: inline-flex;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        width: fit-content;
      }
      .price { margin: 16px 0 8px; font-size: 42px; font-weight: 800; letter-spacing: -0.05em; }
      .plan p { color: var(--muted); font-size: 15px; min-height: 48px; margin: 0 0 16px; }
      ul { margin: 16px 0; padding: 0; list-style: none; flex-grow: 1; }
      li { margin-bottom: 10px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
      li::before { content: "✓"; color: var(--accent); font-weight: 800; }
      
      .meta {
        display: grid;
        gap: 8px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .cta {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border-radius: 12px;
        background: var(--ink);
        color: white;
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      .cta:hover { opacity: 0.9; }
      .cta.secondary {
        background: white;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
      
      @media (max-width: 640px) {
        .nav { flex-direction: column; gap: 12px; }
        h1 { text-align: center; }
        .lead { text-align: center; }
        .footer { flex-direction: column; gap: 16px; text-align: center; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="nav">
        <a href="/" class="brand">LLM Stack</a>
        <div style="display: flex; gap: 16px;">
          <a href="/docs">Docs</a>
          <a href="/client-portal">Portal</a>
          <a href="/signup" style="color: var(--accent); font-weight: 700;">Start Now</a>
        </div>
      </nav>

      <h1>Simple, usage-based plans.</h1>
      <p class="lead">
        Choose the plan that fits your scale. All plans include OpenAI-compatible endpoints and built-in management tools.
      </p>

      <section class="pricing" id="pricing">
        <article class="plan">Loading pricing...</article>
      </section>

      <div class="footer">
        <span>Need custom quotas? Contact our sales team.</span>
        <div style="display: flex; gap: 16px;">
          <a href="/docs" style="color: inherit; text-decoration: none;">API Documentation</a>
          <a href="/client-portal" style="color: inherit; text-decoration: none;">Client Portal</a>
        </div>
      </div>
    </div>

    <script>
      async function loadPricing() {
        const host = document.getElementById("pricing");
        try {
          const response = await fetch("/public/plans");
          const data = await response.json();
          host.innerHTML = data.plans.map((plan) => `
            <article class="plan ${plan.code === 'basic' ? "highlight" : ""}">
              ${plan.code === 'basic' ? '<div class="badge">Most popular</div>' : ""}
              <h2 style="margin:14px 0 0;font-size:24px;font-weight:700;">${plan.name}</h2>
              <div class="price">$${Number(plan.monthly_price).toFixed(0)}<span style="font-size:14px;color:var(--muted);font-weight:500;">/mo</span></div>
              <p>${plan.description || "Scalable LLM inference for your projects."}</p>
              <ul>
                <li>${plan.rate_limit_per_minute} requests per minute</li>
                <li>${plan.daily_token_quota.toLocaleString()} tokens per day</li>
                <li>${plan.monthly_token_quota.toLocaleString()} tokens per month</li>
                <li>${plan.allow_streaming ? "Streaming support" : "Standard response only"}</li>
              </ul>
              <div class="meta">
                <div>Model access: ${plan.allowed_models_json ? "Restricted" : "All available"}</div>
              </div>
              <a class="cta ${plan.code === "free" ? "secondary" : ""}" href="/signup?plan=${plan.code}">
                ${plan.code === "free" ? "Create Free Account" : `Start with ${plan.name}`}
              </a>
            </article>
          `).join("");
        } catch (error) {
          host.innerHTML = `<article class="plan">Unable to load pricing: ${String(error)}</article>`;
        }
      }

      loadPricing();
    </script>
  </body>
</html>
