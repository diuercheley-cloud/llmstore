<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System Monitoring - LLM Inference Stack</title>
    <script src="/static/www/branding-init.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --ink: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #7dd3fc;
        --border: #334155;
        --danger: #f43f5e;
        --success: #10b981;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      header {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .brand h1 { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
      .auth-box { display: flex; gap: 0.5rem; }
      
      input, button {
        font: inherit;
        border-radius: 0.375rem;
        border: 1px solid var(--border);
        padding: 0.5rem 0.75rem;
        background: var(--bg);
        color: var(--ink);
      }
      button {
        background: var(--accent);
        color: var(--bg);
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover { background: var(--accent-hover); }
      
      main {
        padding: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 1.5rem;
        max-width: 1400px;
        margin: 0 auto;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      h2 { margin-top: 0; font-size: 1rem; font-weight: 600; margin-bottom: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .value-display {
        font-family: monospace;
        font-size: 0.875rem;
        color: var(--accent);
        font-weight: 600;
      }
      
      .chart-container {
        position: relative;
        height: 250px;
        width: 100%;
      }
      
      .hidden { display: none !important; }
      #loginPrompt { text-align: center; padding: 4rem 2rem; }
      
      .status-bar {
        display: flex;
        gap: 1rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .status-item { display: flex; align-items: center; gap: 0.5rem; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot-active { background: var(--success); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>System Monitoring</h1>
      </div>
      <div class="auth-box">
        <input type="password" id="adminToken" placeholder="Admin Token" />
        <button id="connect">Connect</button>
        <button id="refresh" class="hidden">Refresh</button>
      </div>
    </header>

    <div id="loginPrompt">
      <p>Enter Admin Token to view real-time system metrics.</p>
    </div>

    <main id="adminContent" class="hidden">
      <section>
        <div class="chart-header">
          <h2>CPU Utilization (%)</h2>
          <span id="cpuValue" class="value-display">--%</span>
        </div>
        <div class="chart-container">
          <canvas id="cpuChart"></canvas>
        </div>
      </section>

      <section>
        <div class="chart-header">
          <h2>RAM Utilization (%)</h2>
          <span id="ramValue" class="value-display">-- GB / -- GB</span>
        </div>
        <div class="chart-container">
          <canvas id="ramChart"></canvas>
        </div>
      </section>

      <section>
        <div class="chart-header">
          <h2>GPU Utilization (%)</h2>
          <span id="gpuValue" class="value-display">--% (VRAM: -- MB)</span>
        </div>
        <div class="chart-container">
          <canvas id="gpuChart"></canvas>
        </div>
      </section>

      <section>
        <div class="chart-header">
          <h2>HDD/SSD Utilization (%)</h2>
          <span id="diskValue" class="value-display">-- GB / -- GB</span>
        </div>
        <div class="chart-container">
          <canvas id="diskChart"></canvas>
        </div>
      </section>

      <div class="status-bar" style="grid-column: 1 / -1; justify-content: center; margin-top: 1rem;">
        <div class="status-item"><div class="dot dot-active"></div> Real-time updates (every 2s)</div>
        <div id="uptimeDisplay" class="status-item">Uptime: --</div>
      </div>
    </main>

    <script>
      const MAX_DATA_POINTS = 30;
      const charts = {};
      const history = {
        labels: [],
        cpu: [],
        ram: [],
        gpu: [],
        disk: []
      };

      const elements = {
        adminToken: document.getElementById('adminToken'),
        connect: document.getElementById('connect'),
        refresh: document.getElementById('refresh'),
        adminContent: document.getElementById('adminContent'),
        loginPrompt: document.getElementById('loginPrompt'),
        uptime: document.getElementById('uptimeDisplay')
      };

      const savedToken = localStorage.getItem('adminToken');
      if (savedToken) {
        elements.adminToken.value = savedToken;
        startMonitoring();
      }

      elements.connect.addEventListener('click', () => {
        localStorage.setItem('adminToken', elements.adminToken.value.trim());
        startMonitoring();
      });

      function createChart(canvas, color) {
        const ctx = canvas.getContext('2d');
        const chart = {
          canvas,
          ctx,
          color,
          data: [],
          update() {
            const width = canvas.clientWidth || canvas.parentElement.clientWidth || 320;
            const height = canvas.clientHeight || canvas.parentElement.clientHeight || 250;
            if (canvas.width !== width) canvas.width = width;
            if (canvas.height !== height) canvas.height = height;

            ctx.clearRect(0, 0, width, height);

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i += 1) {
              const y = (height / 4) * i;
              ctx.beginPath();
              ctx.moveTo(0, y);
              ctx.lineTo(width, y);
              ctx.stroke();
            }

            if (!chart.data.length) return;

            const points = chart.data.map((value, index) => {
              const x = chart.data.length === 1 ? width : (index / (chart.data.length - 1)) * width;
              const y = height - (Math.max(0, Math.min(100, value)) / 100) * height;
              return { x, y };
            });

            ctx.beginPath();
            ctx.moveTo(points[0].x, height);
            points.forEach((point) => ctx.lineTo(point.x, point.y));
            ctx.lineTo(points[points.length - 1].x, height);
            ctx.closePath();
            ctx.fillStyle = `${color}22`;
            ctx.fill();

            ctx.beginPath();
            points.forEach((point, index) => {
              if (index === 0) ctx.moveTo(point.x, point.y);
              else ctx.lineTo(point.x, point.y);
            });
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        };

        return chart;
      }

      function initCharts() {
        charts.cpu = createChart(document.getElementById('cpuChart'), '#38bdf8');
        charts.ram = createChart(document.getElementById('ramChart'), '#10b981');
        charts.gpu = createChart(document.getElementById('gpuChart'), '#f43f5e');
        charts.disk = createChart(document.getElementById('diskChart'), '#fbbf24');
      }

      async function fetchData() {
        const token = elements.adminToken.value.trim();
        try {
          const response = await fetch('/admin/tests/system/resources', {
            headers: { 'X-Admin-Token': token }
          });
          if (!response.ok) throw new Error('Unauthorized');
          return await response.json();
        } catch (err) {
          console.error(err);
          return null;
        }
      }

      function updateCharts(data) {
        if (!data) return;

        const now = new Date().toLocaleTimeString();
        history.labels.push(now);
        if (history.labels.length > MAX_DATA_POINTS) history.labels.shift();

        // Update CPU
        charts.cpu.data.push(data.cpu_percent);
        if (charts.cpu.data.length > MAX_DATA_POINTS) charts.cpu.data.shift();
        charts.cpu.update();
        document.getElementById('cpuValue').textContent = `${data.cpu_percent.toFixed(1)}%`;

        // Update RAM
        charts.ram.data.push(data.memory.percent);
        if (charts.ram.data.length > MAX_DATA_POINTS) charts.ram.data.shift();
        charts.ram.update();
        document.getElementById('ramValue').textContent = `${(data.memory.used_mb / 1024).toFixed(1)} / ${(data.memory.total_mb / 1024).toFixed(1)} GB (${data.memory.percent}%)`;

        // Update GPU
        const gpuVal = data.gpu?.available ? data.gpu.utilization_percent : 0;
        charts.gpu.data.push(gpuVal);
        if (charts.gpu.data.length > MAX_DATA_POINTS) charts.gpu.data.shift();
        charts.gpu.update();
        if (data.gpu?.available) {
          document.getElementById('gpuValue').textContent = `${data.gpu.utilization_percent}% (VRAM: ${data.gpu.vram_used_mb} MB)`;
        } else {
          document.getElementById('gpuValue').textContent = 'N/A';
        }

        // Update Disk
        charts.disk.data.push(data.disk.percent);
        if (charts.disk.data.length > MAX_DATA_POINTS) charts.disk.data.shift();
        charts.disk.update();
        document.getElementById('diskValue').textContent = `${data.disk.used_gb} / ${data.disk.total_gb} GB (${data.disk.percent}%)`;

        // Uptime
        const uptimeHrs = (data.uptime_seconds / 3600).toFixed(1);
        elements.uptime.textContent = `Uptime: ${uptimeHrs}h`;
      }

      let interval;
      async function startMonitoring() {
        if (!elements.adminToken.value.trim()) return;
        
        // Initial test fetch
        const data = await fetchData();
        if (!data) {
          alert('Failed to connect. Check your Admin Token.');
          return;
        }

        elements.adminContent.classList.remove('hidden');
        elements.loginPrompt.classList.add('hidden');
        elements.refresh.classList.remove('hidden');

        if (!charts.cpu) initCharts();

        if (interval) clearInterval(interval);
        updateCharts(data);
        interval = setInterval(async () => {
          const nextData = await fetchData();
          updateCharts(nextData);
        }, 2000);
      }

      window.addEventListener('resize', () => {
        Object.values(charts).forEach((chart) => chart && chart.update());
      });
    </script>
  </body>
</html>
