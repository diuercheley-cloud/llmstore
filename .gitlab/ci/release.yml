release:validate:
  stage: validate
  image: python:3.10
  variables:
    GIT_DEPTH: 0
  script:
    - bash scripts/ci/release-ci.sh $CI_COMMIT_TAG
  artifacts:
    paths:
      - artifacts/releases/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

release:package:
  stage: package
  image: alpine:latest
  script:
    - mkdir -p release-pack
    - cp -r artifacts/releases/* release-pack/ || true
    - echo "Release Version $CI_COMMIT_TAG" > release-pack/version.txt
  artifacts:
    paths:
      - release-pack/
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
