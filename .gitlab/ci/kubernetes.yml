k8s:validate:
  stage: validate
  image: alpine:latest
  script:
    - apk add --no-cache curl bash
    - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    - chmod 700 get_helm.sh
    - ./get_helm.sh
    - helm template llm-stack deploy/kubernetes/helm/llm-inference-stack --debug
    - make k8s-validate || echo "make k8s-validate não definido"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deploy/kubernetes/**/*
        - Makefile
