.deploy_template: &deploy_template
  stage: release
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

deploy:appliance:
  <<: *deploy_template
  image: python:3.10
  environment:
    name: appliance/staging
  script:
    - make preflight
    - make backup
    - make upgrade-release
    - make post-deploy-validate || (make rollback-release && exit 1)

deploy:kubernetes:
  <<: *deploy_template
  image: alpine:latest
  environment:
    name: k8s/staging
  script:
    - apk add --no-cache curl bash
    - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    - chmod 700 get_helm.sh && ./get_helm.sh
    - make deploy-k8s
    - make post-deploy-validate

deploy:pilot:
  <<: *deploy_template
  image: python:3.10
  environment:
    name: enterprise/pilots
  script:
    - make operational-readiness
    - make test-smoke-resilience
    - mkdir -p pilot-artifacts
    - echo "Pilot Deployment Successful" > pilot-artifacts/status.txt
  artifacts:
    paths:
      - pilot-artifacts/
    expire_in: 30 days
