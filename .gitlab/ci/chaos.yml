chaos:test:
  stage: chaos
  image: python:3.10
  variables:
    CHAOS_ENABLED: "true"
    CHAOS_ENVIRONMENT: "test"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        SCENARIO_GROUP="chaos/scenarios/safe-ci"
      elif [ "$CI_COMMIT_TAG" =~ /^v/ ]; then
        SCENARIO_GROUP="chaos/scenarios/extended"
      else
        SCENARIO_GROUP="chaos/scenarios/safe-ci"
      fi
    - bash scripts/chaos-ci-runner.sh $SCENARIO_GROUP
  artifacts:
    when: always
    paths:
      - chaos/reports/
    reports:
      junit: chaos/reports/*/chaos-junit.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/
