security:scan:
  stage: security
  image: python:3.10
  script:
    - bash scripts/ci/security-ci.sh
  artifacts:
    paths:
      - artifacts/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
