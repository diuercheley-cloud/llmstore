docker:build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t llm-inference-stack/control-plane:latest -f control_plane/Dockerfile .
    - docker build -t llm-inference-stack/admin-ui:latest -f frontend/admin/Dockerfile frontend/admin
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/
