groups:
  - name: llm-stack-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(request_total{status=~"5.."}[5m])) / sum(rate(request_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alta taxa de erro detectada ({{ $value | humanizePercentage }})"

      - alert: LatencyBreachP95
        expr: histogram_quantile(0.95, sum(rate(request_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latência p95 acima de 2s"

      - alert: GPUMemoryPressure
        expr: nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes > 0.90
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Pressão de memória GPU no nó {{ $labels.instance }}"
