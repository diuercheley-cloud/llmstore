[pytest]
testpaths = tests
pythonpath = .
addopts = --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
cache_dir = /tmp/pytest-cache
markers =
    unit: Fast unit tests with high isolation
    contract: Tests verifying API/interface contracts
    integration: Tests against real or realistically simulated infrastructure (DB, Network)
    e2e: Full system end-to-end tests
    quick: Fast smoke-oriented checks automatically classified by conftest
    slow: Broader or longer-running checks automatically classified by conftest
    release: Tests included in release validation by default
    release_gate: Tests required for production release
    security: Security-critical validation
    chaos: Chaos engineering/injection tests
    k8s: Kubernetes-specific validation
    cosmetic: High-mock, low-value tests slated for review
    backup_dr: Long-running backup/disaster-recovery recovery tests
    performance: Performance and latency benchmarks
    local_llm: Tests requiring a local LLM runner (e.g. llama-server)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The `from_orm` method is deprecated
    ignore:Legacy Admin UI.*is deprecated
    ignore:.*module 'starlette' has no attribute 'StarletteDeprecationWarning'
