services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - control_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - control_net

  data-plane-gemma:
    build:
      context: .
      dockerfile: docker/data-plane/Dockerfile
    environment:
      MODEL_FILE: ${MODEL_FILE}
      LLAMA_SERVER_PORT: 8081
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE}
      LLAMA_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS}
      LLAMA_THREADS: ${LLAMA_THREADS}
      LLAMA_BATCH_SIZE: ${LLAMA_BATCH_SIZE}
      LLAMA_UBATCH_SIZE: ${LLAMA_UBATCH_SIZE}
      LLAMA_PARALLEL: ${LLAMA_PARALLEL}
      LLAMA_CONT_BATCHING: ${LLAMA_CONT_BATCHING}
      LLAMA_FLASH_ATTN: ${LLAMA_FLASH_ATTN}
      LLAMA_CHAT_TEMPLATE: ${LLAMA_CHAT_TEMPLATE:-}
    volumes:
      - ./models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "8081:8081"
    restart: unless-stopped
    gpus: all
    networks:
      - control_net
      - data_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  data-plane-ollama:
    image: ollama/ollama:0.9.5
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    gpus: all
    networks:
      - control_net
      - data_net

  data-plane-mock:
    build:
      context: .
      dockerfile: docker/data-plane-mock/Dockerfile
    profiles: ["fallback-test"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health').read()"]
      interval: 5s
      timeout: 2s
      retries: 3
    restart: unless-stopped
    networks:
      - control_net
      - data_net

  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane/Dockerfile
    env_file:
      - ${STACK_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DATA_PLANE_BASE_URL: ${DATA_PLANE_BASE_URL}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-plane-gemma:
        condition: service_started
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./control_plane/app:/app/app
      - ./control_plane/app:/app/control_plane/app
      - ./control_plane/alembic:/app/alembic
      - ./control_plane/alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - ./examples:/app/examples
      - ./models:/models:ro
      - ./data:/data
      - ./config:/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tests:/app/tests
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    restart: unless-stopped
    networks:
      - control_net

  control-plane-worker:
    build:
      context: .
      dockerfile: docker/control-plane/Dockerfile
    env_file:
      - ${STACK_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DATA_PLANE_BASE_URL: ${DATA_PLANE_BASE_URL}
      DEMO_MODE: ${DEMO_MODE:-false}
    command: ["sh", "-c", "/opt/venv/bin/python -m alembic upgrade head && /opt/venv/bin/python -m app.workers.generation_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-plane-gemma:
        condition: service_started
    volumes:
      - ./control_plane/app:/app/app
      - ./control_plane/app:/app/control_plane/app
      - ./control_plane/alembic:/app/alembic
      - ./control_plane/alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - ./examples:/app/examples
      - ./models:/models:ro
      - ./data:/data
      - ./config:/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - control_net

  rag-worker:
    build:
      context: .
      dockerfile: docker/control-plane/Dockerfile
    env_file:
      - ${STACK_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    command: ["bash", "-lc", "/opt/venv/bin/python -m app.workers.rag_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./control_plane/app:/app/app
      - ./control_plane/app:/app/control_plane/app
      - ./scripts:/app/scripts
      - ./examples:/app/examples
      - ./data:/data
    restart: unless-stopped
    networks:
      - control_net

  agent-worker:
    profiles: ["agentic"]
    build:
      context: .
      dockerfile: docker/control-plane/Dockerfile
    env_file:
      - ${STACK_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AGENT_EXECUTION_PLANE_ENABLED: "true"
      AGENT_WORKER_ENABLED: "true"
      AGENT_RUNTIME_ENABLED: "true"
    command: ["bash", "-lc", "/opt/venv/bin/python -m app.workers.agent_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'app.workers.agent_worker'"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./control_plane/app:/app/app
      - ./control_plane/app:/app/control_plane/app
      - ./scripts:/app/scripts
      - ./examples:/app/examples
      - ./data:/data
      - ./config:/config:ro
    restart: unless-stopped
    networks:
      - control_net

  prometheus:
    image: prom/prometheus:v2.53.4
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - control_net

  grafana:
    image: grafana/grafana:11.1.4
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - control_net

  pocket-tts:
    build:
      context: .
      dockerfile: docker/pocket-tts/Dockerfile
    restart: unless-stopped
    networks:
      - control_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./monitoring/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - prometheus
    networks:
      - control_net

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - control_net

  promtail:
    image: grafana/promtail:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - /var/log:/var/log:ro
      - ./monitoring/promtail:/etc/promtail:ro
    depends_on:
      - loki
    networks:
      - control_net

  tempo:
    image: grafana/tempo:2.7.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo UI
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
    networks:
      - control_net

volumes:
  postgres_data:
  ollama_data:

networks:
  control_net:
  data_net:
    internal: true
